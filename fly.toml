# fly.toml app configuration file generated for hireme-startups on 2026-11-26T19:19:41Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'hireme-startups'
primary_region = 'sjc'

[build]
[env]
  DB_PATH = '/data/hireme.db'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'hireme_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
